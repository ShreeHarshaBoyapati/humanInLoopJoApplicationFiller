# Temporary HTTP-only Nginx config used before Let's Encrypt certificates exist.
# Serves the certbot ACME HTTP-01 challenge and nothing else.
# Once certbot creates /etc/letsencrypt/live/${DOMAIN}/fullchain.pem the
# entrypoint will switch to nginx.conf (HTTPS + reverse proxy).

server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Everything else returns 503 while TLS is being provisioned.
    location / {
        return 503;
    }
}